<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>局域网聊天室 · IM 客户端</title>
  <style>
    :root {
      --chat-bg-start: #EAF2FF;
      --chat-bg-end: #F8F0FF;
      --sidebar-bg: #FFFFFF;
      --selected-bg: #E6F2FF;
      --hover-bg: #F4F6FA;
      --primary: #1677FF;
      --primary-hover: #0E66E4;
      --primary-active: #0B57C6;
      --text-main: #1F2329;
      --text-secondary: #8F959E;
      --text-tertiary: #B0B6BF;
      --bubble-peer: #FFFFFF;
      --bubble-self: #D6E8FF;
      --border-light: rgba(31, 35, 41, 0.07);
      --border-subtle: rgba(31, 35, 41, 0.05);
      --input-gray: #F2F3F5;
      --shadow-window: 0 20px 60px rgba(31, 56, 110, 0.12), 0 4px 16px rgba(31, 56, 110, 0.06);
      --shadow-bubble: 0 2px 10px rgba(31, 56, 110, 0.05);
      --online-green: #22C55E;
      --offline-red: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei UI",
        "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: var(--text-main);
      background: linear-gradient(135deg, #DCEBFF 0%, #EFE8FF 52%, #E3EEFF 100%);
      -webkit-font-smoothing: antialiased;
    }

    .desktop-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .im-window {
      width: 100%;
      max-width: 1180px;
      height: 100%;
      max-height: 780px;
      display: grid;
      grid-template-columns: 296px 1fr;
      border-radius: 18px;
      overflow: hidden;
      background: var(--sidebar-bg);
      box-shadow: var(--shadow-window);
      border: 1px solid rgba(255, 255, 255, 0.85);
    }

    /* ========= 左侧纯白会话栏 ========= */
    .sidebar {
      display: flex;
      flex-direction: column;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-light);
      min-height: 0;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 14px 12px;
      flex-shrink: 0;
    }

    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 12px;
      border-radius: 18px;
      background: var(--input-gray);
      border: 1px solid transparent;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .search-box:focus-within {
      background: #FFFFFF;
      border-color: rgba(22, 119, 255, 0.35);
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.08);
    }

    .search-box svg {
      width: 15px;
      height: 15px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 13px;
      color: var(--text-main);
    }

    .search-input::placeholder {
      color: var(--text-secondary);
    }

    .new-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--input-gray);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease;
    }

    .new-btn:hover {
      background: var(--selected-bg);
      color: var(--primary);
    }

    .new-btn:active {
      transform: scale(0.95);
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .session-list::-webkit-scrollbar,
    .chat-body::-webkit-scrollbar {
      width: 5px;
    }

    .session-list::-webkit-scrollbar-thumb,
    .chat-body::-webkit-scrollbar-thumb {
      background: rgba(143, 149, 158, 0.28);
      border-radius: 999px;
    }

    .session-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.16s ease;
      user-select: none;
    }

    .session-item:hover {
      background: var(--hover-bg);
    }

    .session-item.active {
      background: var(--selected-bg);
    }

    .avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.3px;
      box-shadow: 0 3px 10px rgba(22, 119, 255, 0.12);
    }

    .avatar.sm {
      width: 36px;
      height: 36px;
      font-size: 12.5px;
    }

    .status-dot {
      position: absolute;
      right: 1px;
      bottom: 1px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--online-green);
      border: 2px solid #FFFFFF;
    }

    .session-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .session-row-top, .session-row-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .session-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-time {
      font-size: 11.5px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .session-preview {
      font-size: 12.5px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .unread-badge {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      border-top: 1px solid var(--border-subtle);
      background: #FAFBFD;
      flex-shrink: 0;
    }

    .me-info {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .me-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .me-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .me-net {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .net-led {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--online-green);
    }

    .net-led.offline {
      background: var(--offline-red);
    }

    .link-btn {
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.16s ease;
    }

    .link-btn:hover {
      background: var(--selected-bg);
    }

    /* ========= 右侧聊天主窗口 ========= */
    .chat-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: linear-gradient(135deg, var(--chat-bg-start) 0%, var(--chat-bg-end) 100%);
    }

    /* 拖拽上传遮罩 */
    .drop-overlay {
      position: absolute;
      inset: 12px;
      z-index: 25;
      border-radius: 16px;
      background: rgba(230, 242, 255, 0.88);
      backdrop-filter: blur(8px);
      border: 2px dashed var(--primary);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--primary);
      font-weight: 500;
      font-size: 15px;
      pointer-events: none;
    }

    .drop-overlay.active {
      display: flex;
    }

    .chat-header {
      height: 64px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.65);
      flex-shrink: 0;
    }

    .chat-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .chat-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(31, 35, 41, 0.05);
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #4E5969;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.78);
      color: var(--primary);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .time-divider {
      align-self: center;
      font-size: 11.5px;
      color: var(--text-secondary);
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.5);
    }

    .sys-notice {
      align-self: center;
      font-size: 12px;
      color: var(--text-secondary);
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .msg-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      max-width: 76%;
      animation: msgIn 0.2s ease-out;
    }

    .msg-row.peer {
      align-self: flex-start;
    }

    .msg-row.self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-content-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .msg-row.self .msg-content-col {
      align-items: flex-end;
    }

    .msg-sender-name {
      font-size: 12px;
      color: var(--text-secondary);
      padding: 0 4px;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-main);
      word-break: break-word;
      white-space: pre-wrap;
      box-shadow: var(--shadow-bubble);
    }

    .msg-row.peer .msg-bubble {
      background: var(--bubble-peer);
      border-top-left-radius: 4px;
    }

    .msg-row.self .msg-bubble {
      background: var(--bubble-self);
      border-top-right-radius: 4px;
    }

    /* ========= 文件 / 图片传输卡片 ========= */
    .file-card {
      width: 280px;
      max-width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      background: #FFFFFF;
      border: 1px solid rgba(31, 35, 41, 0.06);
      box-shadow: var(--shadow-bubble);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-row.self .file-card {
      background: #EEF6FF;
      border-color: rgba(22, 119, 255, 0.14);
    }

    .file-card-top {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .file-ext-badge {
      width: 42px;
      height: 46px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1677FF, #5B9BFF);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(22, 119, 255, 0.2);
    }

    .file-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .file-name {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-size {
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .progress-track {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(22, 119, 255, 0.12);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #1677FF, #4CA3FF);
      transition: width 0.15s ease;
    }

    .file-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .verified-tag {
      color: #16A34A;
      font-weight: 500;
    }

    .failed-tag {
      color: #DC2626;
      font-weight: 500;
    }

    .file-download-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 8px;
      background: rgba(22, 119, 255, 0.1);
      transition: background 0.15s ease;
    }

    .file-download-link:hover {
      background: rgba(22, 119, 255, 0.18);
    }

    /* 图片消息气泡 */
    .image-card {
      padding: 6px;
      border-radius: 14px;
      background: #FFFFFF;
      border: 1px solid rgba(31, 35, 41, 0.06);
      box-shadow: var(--shadow-bubble);
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 280px;
    }

    .msg-row.self .image-card {
      background: #E6F2FF;
    }

    .chat-image-thumb {
      display: block;
      max-width: 266px;
      max-height: 220px;
      width: auto;
      height: auto;
      border-radius: 10px;
      object-fit: cover;
      cursor: zoom-in;
      background: #F4F6FA;
    }

    .image-card-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 4px 2px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* 图片大图预览 Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      border-radius: 14px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
    }

    /* ========= 底部纯白输入工具栏 ========= */
    .composer-area {
      position: relative;
      background: #FFFFFF;
      border-top: 1px solid var(--border-subtle);
      padding: 10px 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .toolbar .icon-btn {
      width: 32px;
      height: 32px;
      color: #646A73;
    }

    .toolbar .icon-btn:hover {
      background: var(--hover-bg);
      color: var(--primary);
    }

    .composer-textarea {
      width: 100%;
      height: 68px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-main);
    }

    .composer-textarea::placeholder {
      color: var(--text-tertiary);
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .composer-hint {
      font-size: 11.5px;
      color: var(--text-tertiary);
    }

    .send-btn {
      appearance: none;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 500;
      padding: 8px 24px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22, 119, 255, 0.25);
      transition: background 0.16s ease, transform 0.1s ease, box-shadow 0.16s ease;
    }

    .send-btn:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 16px rgba(22, 119, 255, 0.32);
    }

    .send-btn:active {
      background: var(--primary-active);
      transform: translateY(1px);
    }

    .emoji-popover {
      position: absolute;
      left: 18px;
      bottom: calc(100% + 8px);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 12px 32px rgba(31, 56, 110, 0.14);
      display: none;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      z-index: 15;
    }

    .emoji-popover.open {
      display: grid;
    }

    .emoji-btn {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 8px;
      background: transparent;
      font-size: 18px;
      cursor: pointer;
    }

    .emoji-btn:hover {
      background: var(--selected-bg);
    }

    .toast {
      position: fixed;
      top: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(31, 35, 41, 0.86);
      color: #FFFFFF;
      font-size: 12.5px;
      padding: 8px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 40;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(31, 35, 41, 0.28);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-mask.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 390px;
      background: #FFFFFF;
      border-radius: 16px;
      padding: 22px 24px;
      box-shadow: 0 20px 56px rgba(31, 56, 110, 0.2);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-title { font-size: 16px; font-weight: 600; color: var(--text-main); }
    .modal-sub { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }
    .form-row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field label { font-size: 12px; color: var(--text-secondary); }
    .form-field input {
      height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      background: #F7F8FA;
      font-size: 13.5px;
      color: var(--text-main);
      outline: none;
    }
    .form-field input:focus {
      background: #FFFFFF;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.1);
    }
    .modal-msg { min-height: 16px; font-size: 12px; color: var(--primary); }
    .modal-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
    .btn-subtle {
      border: 1px solid var(--border-light);
      background: #F7F8FA;
      color: var(--text-main);
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-subtle:hover { background: var(--selected-bg); color: var(--primary); border-color: transparent; }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .desktop-stage { padding: 0; }
      .im-window { max-height: none; border-radius: 0; grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="desktop-stage">
    <div class="im-window">
      <!-- 左侧纯白会话面板 -->
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="search-box">

  <!-- 连接局域网服务端弹窗 -->
  <div id="connModal" class="modal-mask">
    <div class="modal-box">
      <div>
        <div class="modal-title">连接局域网聊天室</div>
        <div class="modal-sub">支持 UDP 局域网广播自动发现服务端，或手动填写服务端 IP 与 TCP 端口。</div>

      <div class="form-row">

          <input id="portInput" value="8888" />

        <input id="nameInput" value="Alice" placeholder="输入 1~20 个非空白字符" />

          <button id="closeModalBtn" class="btn-subtle" type="button">取消</button>
          <button id="connectBtn" class="send-btn" type="button" style="padding:7px 18px;">连接</button>
        </div>

  </div>

  <script>
    const LOBBY_ID = "__lobby__";
    const MAX_FILE_BYTES = 20 * 1024 * 1024;
    const AVATAR_GRADIENTS = [
      "linear-gradient(135deg, #4B8BFF, #6C63FF)",
      "linear-gradient(135deg, #38BDF8, #3B82F6)",
      "linear-gradient(135deg, #818CF8, #A855F7)",
      "linear-gradient(135deg, #34D399, #0EA5E9)",
      "linear-gradient(135deg, #F472B6, #8B5CF6)",
      "linear-gradient(135deg, #60A5FA, #2DD4BF)",
    ];

    function avatarStyle(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
      }
      return AVATAR_GRADIENTS[hash % AVATAR_GRADIENTS.length];
    }

    function avatarInitial(name) {
      if (name === LOBBY_ID) return "群";
      return (name || "?").trim().slice(0, 2).toUpperCase();
    }

    function nowHMS() {
      return new Date().toTimeString().slice(0, 8);
    }

    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function fileExt(filename) {
      const idx = (filename || "").lastIndexOf(".");
      if (idx === -1 || idx === filename.length - 1) return "FILE";
      return filename.slice(idx + 1, idx + 5).toUpperCase();
    }

    const state = {
      liveMode: window.location.protocol.startsWith("http"),
      connected: false,
      username: "Alice",
      host: "192.168.1.100",
      port: 8888,
      users: [],
      activeId: LOBBY_ID,
      search: "",
      sessions: {},
      fileIndex: {}, // file_id -> { sessionId, msg }
      eventSource: null,
    };

    const els = {
      sessionList: document.getElementById("sessionList"),
      searchInput: document.getElementById("searchInput"),
      chatPanel: document.getElementById("chatPanel"),
      dropOverlay: document.getElementById("dropOverlay"),
      chatTitle: document.getElementById("chatTitle"),
      chatSubtitle: document.getElementById("chatSubtitle"),
      chatBody: document.getElementById("chatBody"),
      msgInput: document.getElementById("msgInput"),
      sendBtn: document.getElementById("sendBtn"),
      fileBtn: document.getElementById("fileBtn"),
      imageBtn: document.getElementById("imageBtn"),
      fileInput: document.getElementById("fileInput"),
      imageInput: document.getElementById("imageInput"),
      lightbox: document.getElementById("lightbox"),
      lightboxImg: document.getElementById("lightboxImg"),
      meAvatar: document.getElementById("meAvatar"),
      meName: document.getElementById("meName"),
      netLed: document.getElementById("netLed"),
      netText: document.getElementById("netText"),
      emojiToggleBtn: document.getElementById("emojiToggleBtn"),
      emojiPopover: document.getElementById("emojiPopover"),
      toast: document.getElementById("toast"),
      connModal: document.getElementById("connModal"),
      hostInput: document.getElementById("hostInput"),
      portInput: document.getElementById("portInput"),
      nameInput: document.getElementById("nameInput"),
      modalMsg: document.getElementById("modalMsg"),
      discoverBtn: document.getElementById("discoverBtn"),
      connectBtn: document.getElementById("connectBtn"),
      closeModalBtn: document.getElementById("closeModalBtn"),
      openConnBtn: document.getElementById("openConnBtn"),
      newBtn: document.getElementById("newBtn"),
      moreBtn: document.getElementById("moreBtn"),
    };

    let toastTimer = null;
    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 2200);
    }

    function ensureSession(id, name, isLobby = false) {
      if (!state.sessions[id]) {
        state.sessions[id] = {
          id,
          name,
          isLobby,
          messages: [],
          unread: 0,
          lastText: isLobby ? "点击开始局域网群聊" : "在线 · 点击发送私聊消息",
          lastTime: "",
        };
      }
      return state.sessions[id];
    }

    function syncUserSessions(users) {
      state.users = users;
      ensureSession(LOBBY_ID, "局域网公共大厅", true);
      users.forEach((u) => {
        if (u !== state.username) {
          ensureSession(u, u, false);
        }
      });
      renderSidebar();
      renderHeader();
    }

    function resolveSessionId(pkt) {
      if (!pkt.to) return LOBBY_ID;
      return pkt.sender === state.username ? pkt.to : pkt.sender;
    }

    function appendMessage(sessionId, msg) {
      const session =
        sessionId === LOBBY_ID
          ? ensureSession(LOBBY_ID, "局域网公共大厅", true)
          : ensureSession(sessionId, sessionId, false);
      session.messages.push(msg);

      if (msg.kind === "system") {
        session.lastText = `[系统] ${msg.text}`;
      } else if (msg.kind === "file") {
        const tag = msg.isImage ? "[图片]" : "[文件]";
        session.lastText = session.isLobby
          ? `${msg.sender}: ${tag} ${msg.filename}`
          : `${tag} ${msg.filename}`;
      } else {
        session.lastText = session.isLobby ? `${msg.sender}: ${msg.text}` : msg.text;
      }

      session.lastTime = (msg.ts || nowHMS()).slice(0, 5);
      if (state.activeId !== sessionId && msg.kind !== "system") {
        session.unread += 1;
      }
      renderSidebar();
      if (state.activeId === sessionId) {
        renderMessages();
      }
    }

    function renderMe() {
      els.meName.textContent = state.connected ? state.username : "未登录";
      els.meAvatar.textContent = avatarInitial(state.username);
      els.meAvatar.style.background = avatarStyle(state.username);
      els.netLed.classList.toggle("offline", !state.connected);
      els.netText.textContent = state.connected ? `${state.host}:${state.port}` : "未连接服务端";
    }

    function renderHeader() {
      const active = state.sessions[state.activeId] || ensureSession(LOBBY_ID, "局域网公共大厅", true);
      els.chatTitle.textContent = active.name;
      if (active.isLobby) {
        els.chatSubtitle.textContent = `局域网群聊 · 在线 ${state.users.length} 人`;
      } else {
        const isOnline = state.users.includes(active.id);
        els.chatSubtitle.textContent = isOnline ? "在线 · 点对点私聊" : "离线";
      }
    }

    function renderSidebar() {
      const q = state.search.trim().toLowerCase();
      const orderedIds = [
        LOBBY_ID,
        ...Object.keys(state.sessions).filter((id) => id !== LOBBY_ID),
      ];

      els.sessionList.innerHTML = "";
      orderedIds.forEach((id) => {
        const s = state.sessions[id];
        if (!s) return;
        if (q && !s.name.toLowerCase().includes(q) && !s.lastText.toLowerCase().includes(q)) {
          return;
        }

        const item = document.createElement("div");
        item.className = "session-item" + (state.activeId === id ? " active" : "");

        const isOnline = s.isLobby ? state.connected : state.users.includes(s.id);
        item.innerHTML = `
          <div class="avatar-wrap">
            <div class="avatar" style="background:${s.isLobby ? "linear-gradient(135deg,#1677FF,#69B1FF)" : avatarStyle(s.name)};">${avatarInitial(s.isLobby ? LOBBY_ID : s.name)}</div>
            ${isOnline ? '<span class="status-dot"></span>' : ""}
          </div>
          <div class="session-main">
            <div class="session-row-top">
              <span class="session-name"></span>
              <span class="session-time"></span>
            </div>
            <div class="session-row-bottom">
              <span class="session-preview"></span>
              ${s.unread > 0 ? `<span class="unread-badge">${s.unread > 99 ? "99+" : s.unread}</span>` : ""}
            </div>
          </div>
        `;
        item.querySelector(".session-name").textContent = s.name;
        item.querySelector(".session-time").textContent = s.lastTime;
        item.querySelector(".session-preview").textContent = s.lastText;

        item.addEventListener("click", () => {
          state.activeId = id;
          s.unread = 0;
          renderSidebar();
          renderHeader();
          renderMessages();
          els.msgInput.focus();
        });

        els.sessionList.appendChild(item);
      });
    }

    function buildFileElement(m) {
      if (m.status === "done" && m.isImage && m.url) {
        const card = document.createElement("div");
        card.className = "image-card";
        card.dataset.fileId = m.fileId;

        const img = document.createElement("img");
        img.className = "chat-image-thumb";
        img.src = m.url;
        img.alt = m.filename;
        img.addEventListener("click", () => {
          els.lightboxImg.src = m.url;
          els.lightbox.classList.add("open");
        });

        const bar = document.createElement("div");
        bar.className = "image-card-bar";
        const statusSpan = document.createElement("span");
        statusSpan.className = m.verified ? "verified-tag" : "failed-tag";
        statusSpan.textContent = m.verified
          ? `SHA-256 已校验 · ${formatSize(m.size)}`
          : "校验异常";

        const dl = document.createElement("a");
        dl.className = "file-download-link";
        dl.href = m.url.startsWith("blob:") ? m.url : `${m.url}?download=1`;
        dl.download = m.filename;
        dl.textContent = "保存";

        bar.appendChild(statusSpan);
        bar.appendChild(dl);
        card.appendChild(img);
        card.appendChild(bar);
        return card;
      }

      const card = document.createElement("div");
      card.className = "file-card";
      card.dataset.fileId = m.fileId;

      const top = document.createElement("div");
      top.className = "file-card-top";
      top.innerHTML = `
        <div class="file-ext-badge">${fileExt(m.filename)}</div>
        <div class="file-meta">
          <div class="file-name"></div>
          <div class="file-size">${formatSize(m.size)} · ${m.totalChunks} 个 TCP 分块</div>
        </div>
      `;
      top.querySelector(".file-name").textContent = m.filename;
      card.appendChild(top);

      if (m.status !== "done") {
        const track = document.createElement("div");
        track.className = "progress-track";
        const fill = document.createElement("div");
        fill.className = "progress-fill";
        fill.style.width = `${m.percent || 0}%`;
        track.appendChild(fill);
        card.appendChild(track);

        const footer = document.createElement("div");
        footer.className = "file-card-footer";
        footer.innerHTML = `
          <span class="progress-text">TCP 分块传输 ${m.receivedChunks || 0}/${m.totalChunks}</span>
          <span class="progress-pct">${m.percent || 0}%</span>
        `;
        card.appendChild(footer);
      } else {
        const footer = document.createElement("div");
        footer.className = "file-card-footer";
        const badge = document.createElement("span");
        badge.className = m.verified ? "verified-tag" : "failed-tag";
        badge.textContent = m.verified ? "✓ SHA-256 校验通过" : "✕ 校验未通过";
        footer.appendChild(badge);

        if (m.url) {
          const dl = document.createElement("a");
          dl.className = "file-download-link";
          dl.href = m.url.startsWith("blob:") ? m.url : `${m.url}?download=1`;
          dl.download = m.filename;
          dl.textContent = "下载文件";
          footer.appendChild(dl);
        }
        card.appendChild(footer);
      }

      return card;
    }

    function updateFileProgressDOM(fileId, receivedChunks, totalChunks, percent) {
      const card = els.chatBody.querySelector(`.file-card[data-file-id="${fileId}"]`);
      if (!card) return;
      const fill = card.querySelector(".progress-fill");
      const text = card.querySelector(".progress-text");
      const pct = card.querySelector(".progress-pct");
      if (fill) fill.style.width = `${percent}%`;
      if (text) text.textContent = `TCP 分块传输 ${receivedChunks}/${totalChunks}`;
      if (pct) pct.textContent = `${percent}%`;
    }

    function renderMessages() {
      const active = state.sessions[state.activeId] || ensureSession(LOBBY_ID, "局域网公共大厅", true);
      els.chatBody.innerHTML = "";

      let lastMinute = "";
      active.messages.forEach((m) => {
        const minute = (m.ts || "").slice(0, 5);
        if (minute && minute !== lastMinute) {
          const divider = document.createElement("div");
          divider.className = "time-divider";
          divider.textContent = minute;
          els.chatBody.appendChild(divider);
          lastMinute = minute;
        }

        if (m.kind === "system") {
          const notice = document.createElement("div");
          notice.className = "sys-notice";
          notice.textContent = m.text;
          els.chatBody.appendChild(notice);
          return;
        }

        const isSelf = m.sender === state.username;
        const row = document.createElement("div");
        row.className = `msg-row ${isSelf ? "self" : "peer"}`;

        const avatar = document.createElement("div");
        avatar.className = "avatar sm";
        avatar.style.background = avatarStyle(m.sender);
        avatar.textContent = avatarInitial(m.sender);

        const col = document.createElement("div");
        col.className = "msg-content-col";

        if (active.isLobby && !isSelf) {
          const senderEl = document.createElement("div");
          senderEl.className = "msg-sender-name";
          senderEl.textContent = m.sender;
          col.appendChild(senderEl);
        }

        if (m.kind === "file") {
          col.appendChild(buildFileElement(m));
        } else {
          const bubble = document.createElement("div");
          bubble.className = "msg-bubble";
          bubble.textContent = m.text;
          col.appendChild(bubble);
        }

        row.appendChild(avatar);
        row.appendChild(col);
        els.chatBody.appendChild(row);
      });

      els.chatBody.scrollTop = els.chatBody.scrollHeight;
    }

    /* ========= 发送文本消息 ========= */
    async function sendCurrentMessage() {
      const text = els.msgInput.value.trim();
      if (!text) return;
      els.msgInput.value = "";
      els.emojiPopover.classList.remove("open");

      const isLobby = state.activeId === LOBBY_ID;
      const to = isLobby ? null : state.activeId;

      if (!state.liveMode) {
        appendMessage(state.activeId, {
          kind: to ? "private" : "chat",
          sender: state.username,
          to: to || undefined,
          text,
          ts: nowHMS(),
        });
        return;
      }

      if (!state.connected) {
        openModal();
        return;
      }

      const res = await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ to, text }),
      });
      const data = await res.json();
      if (!data.ok) {
        showToast(data.error || "发送失败");
      }
    }

    /* ========= 发送文件 / 图片（真实 TCP 分块传输） ========= */
    async function uploadFileOrImage(file, forceImage = null) {
      if (!file) return;
      if (file.size > MAX_FILE_BYTES) {
        showToast("单个文件不能超过 20 MB");
        return;
      }

      const isImage = forceImage !== null ? forceImage : file.type.startsWith("image/");
      const to = state.activeId === LOBBY_ID ? null : state.activeId;

      if (!state.liveMode) {
        // 离线预览模式：按 48 KB 模拟分块进度 + 本地 Blob 预览
        const totalChunks = Math.max(1, Math.ceil(file.size / (48 * 1024)));
        const fileId = `demo_${Date.now()}_${Math.random().toString(16).slice(2, 6)}`;
        const blobUrl = URL.createObjectURL(file);
        const msg = {
          kind: "file",
          fileId,
          filename: file.name,
          size: file.size,
          isImage,
          totalChunks,
          receivedChunks: 0,
          percent: 0,
          status: "transferring",
          verified: false,
          url: null,
          sender: state.username,
          to,
          ts: nowHMS(),
        };
        state.fileIndex[fileId] = { sessionId: state.activeId, msg };
        appendMessage(state.activeId, msg);

        let seq = 0;
        const step = Math.max(1, Math.ceil(totalChunks / 8));
        const timer = setInterval(() => {
          seq = Math.min(totalChunks, seq + step);
          msg.receivedChunks = seq;
          msg.percent = Math.min(100, Math.round((seq / totalChunks) * 100));
          updateFileProgressDOM(fileId, seq, totalChunks, msg.percent);
          if (seq >= totalChunks) {
            clearInterval(timer);
            msg.status = "done";
            msg.verified = true;
            msg.url = blobUrl;
            if (state.activeId === state.fileIndex[fileId].sessionId) {
              renderMessages();
            }
            showToast(`${isImage ? "图片" : "文件"}分块传输演示完成`);
          }
        }, 90);
        return;
      }

      if (!state.connected) {
        openModal();
        return;
      }

      try {
        const headers = {
          "Content-Type": "application/octet-stream",
          "X-Filename": encodeURIComponent(file.name),
          "X-Mime-Type": file.type || "application/octet-stream",
          "X-Is-Image": isImage ? "true" : "false",
        };
        if (to) {
          headers["X-To"] = encodeURIComponent(to);
        }

        const res = await fetch("/api/upload", {
          method: "POST",
          headers,
          body: file,
        });
        const data = await res.json();
        if (!data.ok) {
          showToast(data.error || "文件上传失败");
        } else {
          showToast(`开始 TCP 分块发送 ${file.name}（共 ${data.total_chunks} 块）`);
        }
      } catch (err) {
        showToast(`发送异常: ${err.message}`);
      }
    }

    els.fileBtn.addEventListener("click", () => els.fileInput.click());
    els.imageBtn.addEventListener("click", () => els.imageInput.click());

    els.fileInput.addEventListener("change", () => {
      const file = els.fileInput.files && els.fileInput.files[0];
      els.fileInput.value = "";
      if (file) uploadFileOrImage(file, null);
    });

    els.imageInput.addEventListener("change", () => {
      const file = els.imageInput.files && els.imageInput.files[0];
      els.imageInput.value = "";
      if (file) uploadFileOrImage(file, true);
    });

    // 支持 Ctrl+V 直接粘贴截图/图片
    els.msgInput.addEventListener("paste", (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.kind === "file") {
          const f = item.getAsFile();
          if (f) {
            e.preventDefault();
            uploadFileOrImage(f, f.type.startsWith("image/"));
            return;
          }
        }
      }
    });

    // 支持拖拽文件到聊天区域发送
    let dragCounter = 0;
    els.chatPanel.addEventListener("dragenter", (e) => {
      e.preventDefault();
      dragCounter += 1;
      els.dropOverlay.classList.add("active");
    });
    els.chatPanel.addEventListener("dragover", (e) => e.preventDefault());
    els.chatPanel.addEventListener("dragleave", () => {
      dragCounter = Math.max(0, dragCounter - 1);
      if (dragCounter === 0) els.dropOverlay.classList.remove("active");
    });
    els.chatPanel.addEventListener("drop", (e) => {
      e.preventDefault();
      dragCounter = 0;
      els.dropOverlay.classList.remove("active");
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) uploadFileOrImage(file, null);
    });

    els.lightbox.addEventListener("click", () => {
      els.lightbox.classList.remove("open");
    });

    els.sendBtn.addEventListener("click", sendCurrentMessage);
    els.msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendCurrentMessage();
      }
    });

    /* ========= 搜索、表情与工具栏交互 ========= */
    els.searchInput.addEventListener("input", (e) => {
      state.search = e.target.value;
      renderSidebar();
    });

    els.emojiToggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      els.emojiPopover.classList.toggle("open");
    });

    els.emojiPopover.addEventListener("click", (e) => {
      const btn = e.target.closest(".emoji-btn");
      if (!btn) return;
      els.msgInput.value += btn.textContent;
      els.msgInput.focus();
      els.emojiPopover.classList.remove("open");
    });

    document.addEventListener("click", (e) => {
      if (!els.emojiPopover.contains(e.target) && e.target !== els.emojiToggleBtn) {
        els.emojiPopover.classList.remove("open");
      }
    });

    document.querySelectorAll("[data-action]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const action = btn.getAttribute("data-action");
        showToast(`「${action}」预留扩展入口（当前已支持文字、图片、文件 TCP 传输）`);
      });
    });

    /* ========= 连接弹窗与 SSE 实时事件处理 ========= */
    function openModal() {
      els.modalMsg.textContent = "";
      els.connModal.classList.add("open");
    }

    els.openConnBtn.addEventListener("click", openModal);
    els.newBtn.addEventListener("click", openModal);
    els.moreBtn.addEventListener("click", openModal);
    els.closeModalBtn.addEventListener("click", () => els.connModal.classList.remove("open"));

    function handlePacket(pkt) {
      const ts = pkt.ts || nowHMS();
      if (pkt.type === "CHAT") {
        appendMessage(LOBBY_ID, { kind: "chat", sender: pkt.sender, text: pkt.text, ts });
      } else if (pkt.type === "PRIVATE") {
        const peer = resolveSessionId(pkt);
        appendMessage(peer, {
          kind: "private",
          sender: pkt.sender,
          to: pkt.to,
          text: pkt.text,
          ts,
        });
      } else if (pkt.type === "FILE_START") {
        const sessionId = resolveSessionId(pkt);
        const msg = {
          kind: "file",
          fileId: pkt.file_id,
          filename: pkt.filename,
          size: pkt.size,
          isImage: Boolean(pkt.is_image),
          totalChunks: pkt.total_chunks || 1,
          receivedChunks: 0,
          percent: 0,
          status: "transferring",
          verified: false,
          url: null,
          sender: pkt.sender,
          to: pkt.to,
          ts,
        };
        state.fileIndex[pkt.file_id] = { sessionId, msg };
        appendMessage(sessionId, msg);
      } else if (pkt.type === "FILE_PROGRESS") {
        const entry = state.fileIndex[pkt.file_id];
        if (!entry) return;
        entry.msg.receivedChunks = pkt.received_chunks;
        entry.msg.percent = pkt.percent;
        if (state.activeId === entry.sessionId) {
          updateFileProgressDOM(
            pkt.file_id,
            pkt.received_chunks,
            pkt.total_chunks,
            pkt.percent
          );
        }
      } else if (pkt.type === "FILE_COMPLETE") {
        const entry = state.fileIndex[pkt.file_id];
        if (entry) {
          entry.msg.status = "done";
          entry.msg.percent = 100;
          entry.msg.receivedChunks = entry.msg.totalChunks;
          entry.msg.verified = Boolean(pkt.verified);
          entry.msg.url = pkt.url;
          if (state.activeId === entry.sessionId) {
            renderMessages();
          }
        } else {
          const sessionId = resolveSessionId(pkt);
          const msg = {
            kind: "file",
            fileId: pkt.file_id,
            filename: pkt.filename,
            size: pkt.size,
            isImage: Boolean(pkt.is_image),
            totalChunks: pkt.total_chunks || 1,
            receivedChunks: pkt.total_chunks || 1,
            percent: 100,
            status: "done",
            verified: Boolean(pkt.verified),
            url: pkt.url,
            sender: pkt.sender,
            to: pkt.to,
            ts,
          };
          state.fileIndex[pkt.file_id] = { sessionId, msg };
          appendMessage(sessionId, msg);
        }
      } else if (pkt.type === "SYSTEM") {
        appendMessage(LOBBY_ID, { kind: "system", text: pkt.text, ts });
      } else if (pkt.type === "ERROR") {
        showToast(pkt.text || "服务端返回错误");
      } else if (pkt.type === "USER_LIST") {
        syncUserSessions(pkt.users || []);
      } else if (pkt.type === "DISCONNECTED") {
        state.connected = false;
        renderMe();
        appendMessage(LOBBY_ID, { kind: "system", text: pkt.text || "连接已断开", ts });
      }
    }

    function startSSE() {
      if (state.eventSource) state.eventSource.close();
      const es = new EventSource("/api/events");
      state.eventSource = es;
      es.onmessage = (ev) => {
        try {
          handlePacket(JSON.parse(ev.data));
        } catch (_) {}
      };
    }

    els.discoverBtn.addEventListener("click", async () => {
      if (!state.liveMode) {
        els.hostInput.value = "192.168.1.100";
        els.portInput.value = "8888";
        els.modalMsg.textContent = "演示模式：已模拟发现局域网服务端 192.168.1.100:8888";
        return;
      }
      els.modalMsg.textContent = "正在广播 UDP 探测包寻找局域网服务端...";
      try {
        const res = await fetch("/api/discover");
        const data = await res.json();
        if (data.ok) {
          els.hostInput.value = data.host;
          els.portInput.value = String(data.port);
          els.modalMsg.textContent = `已发现 ${data.server_name} (${data.host}:${data.port})`;
        } else {
          els.modalMsg.textContent = "未收到局域网广播响应，请确认服务端已启动。";
        }
      } catch (err) {
        els.modalMsg.textContent = `自动发现失败: ${err.message}`;
      }
    });

    els.connectBtn.addEventListener("click", async () => {
      const host = els.hostInput.value.trim();
      const port = Number(els.portInput.value.trim());
      const username = els.nameInput.value.trim();
      if (!host || !port || !username) {
        els.modalMsg.textContent = "请完整填写服务端 IP、端口和昵称。";
        return;
      }

      if (!state.liveMode) {
        state.host = host;
        state.port = port;
        state.username = username;
        state.connected = true;
        renderMe();
        els.connModal.classList.remove("open");
        showToast(`已切换身份为 ${username}`);
        return;
      }

      els.modalMsg.textContent = `正在连接 ${host}:${port} ...`;
      try {
        const res = await fetch("/api/connect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ host, port, username }),
        });
        const data = await res.json();
        if (!data.ok) {
          els.modalMsg.textContent = data.error || "连接失败";
          return;
        }
        state.host = host;
        state.port = port;
        state.username = data.username;
        state.connected = true;
        renderMe();
        syncUserSessions(data.users || []);
        startSSE();
        els.connModal.classList.remove("open");
        showToast("已成功接入局域网聊天室");
      } catch (err) {
        els.modalMsg.textContent = `连接异常: ${err.message}`;
      }
    });

    /* ========= 启动初始化 ========= */
    (async function init() {
      ensureSession(LOBBY_ID, "局域网公共大厅", true);

      if (state.liveMode) {
        try {
          const res = await fetch("/api/status");
          if (!res.ok) throw new Error("no live bridge");
          const data = await res.json();
          if (data.connected) {
            state.connected = true;
            state.host = data.host;
            state.port = data.port;
            state.username = data.username;
            renderMe();
            syncUserSessions(data.users || []);
            renderMessages();
            startSSE();
          } else {
            state.connected = false;
            renderMe();
            renderSidebar();
            renderHeader();
            renderMessages();
            openModal();
          }
          return;
        } catch (_) {
          state.liveMode = false;
        }
      }

      // 独立预览演示数据
      state.connected = true;
      state.username = "林澈";
      state.host = "192.168.1.100";
      state.port = 8888;
      renderMe();
      syncUserSessions(["林澈", "陈默", "苏晚", "计网实验机-04"]);

      appendMessage(LOBBY_ID, { kind: "system", text: "已通过 UDP 广播自动发现局域网服务端 192.168.1.100:8888", ts: "20:12:03" });
      appendMessage(LOBBY_ID, { kind: "chat", sender: "陈默", text: "大家好，Wireshark 里已经抓到 8888 端口的三次握手和 48 KB 文件分块帧了。", ts: "20:12:18" });
      appendMessage(LOBBY_ID, {
        kind: "file",
        fileId: "demo_report_pdf",
        filename: "计算机网络实验报告-局域网聊天室.pdf",
        size: 1384200,
        isImage: false,
        totalChunks: 29,
        receivedChunks: 29,
        percent: 100,
        status: "done",
        verified: true,
        url: null,
        sender: "苏晚",
        ts: "20:13:05",
      });
      appendMessage(LOBBY_ID, { kind: "chat", sender: "林澈", text: "收到，点底部「文件」或「图片」图标（或直接拖拽/粘贴）就能体验 TCP 分块传输！", ts: "20:14:09" });

      appendMessage("陈默", { kind: "private", sender: "陈默", to: "林澈", text: "等会儿答辩演示时我们测试一下私聊发图和大文件校验。", ts: "20:13:20" });
      state.sessions[LOBBY_ID].unread = 0;
      state.sessions["陈默"].unread = 1;
      renderSidebar();
      renderHeader();
      renderMessages();
    })();
  </script>
</body>
</html>
