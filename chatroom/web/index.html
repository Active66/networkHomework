<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>局域网聊天室 · IM 客户端</title>
  <style>
    :root {
      --chat-bg-start: #EAF2FF;
      --chat-bg-end: #F8F0FF;
      --sidebar-bg: #FFFFFF;
      --selected-bg: #E6F2FF;
      --hover-bg: #F4F6FA;
      --primary: #1677FF;
      --primary-hover: #0E66E4;
      --primary-active: #0B57C6;
      --text-main: #1F2329;
      --text-secondary: #8F959E;
      --text-tertiary: #B0B6BF;
      --bubble-peer: #FFFFFF;
      --bubble-self: #D6E8FF;
      --border-light: rgba(31, 35, 41, 0.07);
      --border-subtle: rgba(31, 35, 41, 0.05);
      --input-gray: #F2F3F5;
      --shadow-window: 0 20px 60px rgba(31, 56, 110, 0.12), 0 4px 16px rgba(31, 56, 110, 0.06);
      --shadow-bubble: 0 2px 10px rgba(31, 56, 110, 0.05);
      --online-green: #22C55E;
      --offline-red: #EF4444;
      --warn-bg: #FFF7E6;
      --warn-text: #B45309;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei UI",
        "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: var(--text-main);
      background: linear-gradient(135deg, #DCEBFF 0%, #EFE8FF 52%, #E3EEFF 100%);
      -webkit-font-smoothing: antialiased;
    }

    .desktop-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .im-window {
      width: 100%;
      max-width: 1180px;
      height: 100%;
      max-height: 780px;
      display: grid;
      grid-template-columns: 296px 1fr;
      border-radius: 18px;
      overflow: hidden;
      background: var(--sidebar-bg);
      box-shadow: var(--shadow-window);
      border: 1px solid rgba(255, 255, 255, 0.85);
    }

    /* ========= 左侧纯白会话栏 ========= */
    .sidebar {
      display: flex;
      flex-direction: column;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-light);
      min-height: 0;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 14px 12px;
      flex-shrink: 0;
    }

    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 12px;
      border-radius: 18px;
      background: var(--input-gray);
      border: 1px solid transparent;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .search-box:focus-within {
      background: #FFFFFF;
      border-color: rgba(22, 119, 255, 0.35);
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.08);
    }

    .search-box svg { width: 15px; height: 15px; color: var(--text-secondary); flex-shrink: 0; }

    .search-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 13px;
      color: var(--text-main);
    }

    .search-input::placeholder { color: var(--text-secondary); }

    .new-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--input-gray);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease;
    }

    .new-btn:hover { background: var(--selected-bg); color: var(--primary); }
    .new-btn:active { transform: scale(0.95); }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .session-group-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 8px 10px 4px;
      letter-spacing: 0.4px;
    }

    .session-list::-webkit-scrollbar,
    .chat-body::-webkit-scrollbar { width: 5px; }

    .session-list::-webkit-scrollbar-thumb,
    .chat-body::-webkit-scrollbar-thumb {
      background: rgba(143, 149, 158, 0.28);
      border-radius: 999px;
    }

    .session-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.16s ease;
      user-select: none;
    }

    .session-item:hover { background: var(--hover-bg); }
    .session-item.active { background: var(--selected-bg); }

    .avatar-wrap { position: relative; flex-shrink: 0; }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.3px;
      box-shadow: 0 3px 10px rgba(22, 119, 255, 0.12);
    }

    .avatar.sm { width: 36px; height: 36px; font-size: 12.5px; }

    .status-dot {
      position: absolute;
      right: 1px;
      bottom: 1px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--online-green);
      border: 2px solid #FFFFFF;
    }

    .session-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .session-row-top, .session-row-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .session-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-time { font-size: 11.5px; color: var(--text-secondary); flex-shrink: 0; }

    .session-preview {
      font-size: 12.5px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .unread-badge {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      border-top: 1px solid var(--border-subtle);
      background: #FAFBFD;
      flex-shrink: 0;
    }

    .me-info { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .me-meta { display: flex; flex-direction: column; min-width: 0; }
    .me-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .me-net {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .net-led { width: 6px; height: 6px; border-radius: 50%; background: var(--online-green); }
    .net-led.offline { background: var(--offline-red); }

    .link-btn {
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.16s ease;
    }
    .link-btn:hover { background: var(--selected-bg); }

    /* ========= 右侧聊天主窗口 ========= */
    .chat-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: linear-gradient(135deg, var(--chat-bg-start) 0%, var(--chat-bg-end) 100%);
    }

    .drop-overlay {
      position: absolute;
      inset: 12px;
      z-index: 25;
      border-radius: 16px;
      background: rgba(230, 242, 255, 0.88);
      backdrop-filter: blur(8px);
      border: 2px dashed var(--primary);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--primary);
      font-weight: 500;
      font-size: 15px;
      pointer-events: none;
    }
    .drop-overlay.active { display: flex; }

    .chat-header {
      height: 64px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.65);
      flex-shrink: 0;
    }

    .chat-title-group { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .chat-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(31, 35, 41, 0.05);
      white-space: nowrap;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; }

    .header-pill-btn {
      border: 1px solid rgba(31, 35, 41, 0.08);
      background: rgba(255, 255, 255, 0.76);
      color: #4E5969;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .header-pill-btn:hover { background: #FFFFFF; color: var(--primary); border-color: rgba(22, 119, 255, 0.25); }
    .header-pill-btn.danger:hover { color: #DC2626; border-color: rgba(220, 38, 38, 0.25); }

    /* 自动重连提示横幅 */
    .reconnect-banner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 7px 16px;
      background: var(--warn-bg);
      color: var(--warn-text);
      font-size: 12.5px;
      border-bottom: 1px solid rgba(180, 83, 9, 0.14);
      flex-shrink: 0;
    }
    .reconnect-banner.visible { display: flex; }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #4E5969;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.78); color: var(--primary); }
    .icon-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .time-divider {
      align-self: center;
      font-size: 11.5px;
      color: var(--text-secondary);
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.5);
    }

    .sys-notice {
      align-self: center;
      font-size: 12px;
      color: var(--text-secondary);
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .msg-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      max-width: 76%;
      animation: msgIn 0.2s ease-out;
    }
    .msg-row.peer { align-self: flex-start; }
    .msg-row.self { align-self: flex-end; flex-direction: row-reverse; }

    .msg-content-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .msg-row.self .msg-content-col { align-items: flex-end; }
    .msg-sender-name { font-size: 12px; color: var(--text-secondary); padding: 0 4px; }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-main);
      word-break: break-word;
      white-space: pre-wrap;
      box-shadow: var(--shadow-bubble);
    }
    .msg-row.peer .msg-bubble { background: var(--bubble-peer); border-top-left-radius: 4px; }
    .msg-row.self .msg-bubble { background: var(--bubble-self); border-top-right-radius: 4px; }

    .msg-status {
      font-size: 11px;
      color: var(--text-secondary);
      padding: 0 4px;
      user-select: none;
    }
    .msg-status.read { color: var(--primary); }

    /* ========= 文件 / 图片传输卡片 ========= */
    .file-card {
      width: 280px;
      max-width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      background: #FFFFFF;
      border: 1px solid rgba(31, 35, 41, 0.06);
      box-shadow: var(--shadow-bubble);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg-row.self .file-card { background: #EEF6FF; border-color: rgba(22, 119, 255, 0.14); }

    .file-card-top { display: flex; align-items: center; gap: 11px; }
    .file-ext-badge {
      width: 42px;
      height: 46px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1677FF, #5B9BFF);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .file-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .file-name {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-size { font-size: 11.5px; color: var(--text-secondary); }
    .progress-track { width: 100%; height: 5px; border-radius: 999px; background: rgba(22, 119, 255, 0.12); overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #1677FF, #4CA3FF); transition: width 0.15s ease; }
    .file-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--text-secondary); }
    .verified-tag { color: #16A34A; font-weight: 500; }
    .failed-tag { color: #DC2626; font-weight: 500; }
    .file-download-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 8px;
      background: rgba(22, 119, 255, 0.1);
    }
    .file-download-link:hover { background: rgba(22, 119, 255, 0.18); }

    .image-card {
      padding: 6px;
      border-radius: 14px;
      background: #FFFFFF;
      border: 1px solid rgba(31, 35, 41, 0.06);
      box-shadow: var(--shadow-bubble);
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 280px;
    }
    .msg-row.self .image-card { background: #E6F2FF; }
    .chat-image-thumb {
      display: block;
      max-width: 266px;
      max-height: 220px;
      border-radius: 10px;
      object-fit: cover;
      cursor: zoom-in;
      background: #F4F6FA;
    }
    .image-card-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 4px 2px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 14px; }

    /* ========= 底部纯白输入工具栏（仅保留真实可用功能） ========= */
    .composer-area {
      position: relative;
      background: #FFFFFF;
      border-top: 1px solid var(--border-subtle);
      padding: 10px 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .toolbar { display: flex; align-items: center; gap: 4px; }
    .toolbar .icon-btn { width: 32px; height: 32px; color: #646A73; }
    .toolbar .icon-btn:hover { background: var(--hover-bg); color: var(--primary); }

    .composer-textarea {
      width: 100%;
      height: 68px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-main);
    }
    .composer-textarea::placeholder { color: var(--text-tertiary); }

    .composer-footer { display: flex; align-items: center; justify-content: space-between; }
    .composer-hint { font-size: 11.5px; color: var(--text-tertiary); }

    .send-btn {
      appearance: none;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 500;
      padding: 8px 24px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22, 119, 255, 0.25);
      transition: background 0.16s ease, transform 0.1s ease;
    }
    .send-btn:hover { background: var(--primary-hover); }
    .send-btn:active { background: var(--primary-active); transform: translateY(1px); }

    .emoji-popover {
      position: absolute;
      left: 18px;
      bottom: calc(100% + 8px);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 12px 32px rgba(31, 56, 110, 0.14);
      display: none;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      z-index: 15;
    }
    .emoji-popover.open { display: grid; }
    .emoji-btn { width: 34px; height: 34px; border: none; border-radius: 8px; background: transparent; font-size: 18px; cursor: pointer; }
    .emoji-btn:hover { background: var(--selected-bg); }

    .toast {
      position: fixed;
      top: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(31, 35, 41, 0.86);
      color: #FFFFFF;
      font-size: 12.5px;
      padding: 8px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 40;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 弹窗样式 */
    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(31, 35, 41, 0.28);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-mask.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 410px;
      background: #FFFFFF;
      border-radius: 16px;
      padding: 22px 24px;
      box-shadow: 0 20px 56px rgba(31, 56, 110, 0.2);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-title { font-size: 16px; font-weight: 600; color: var(--text-main); }
    .modal-sub { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }
    .form-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; }
    .form-inline { display: flex; gap: 8px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .form-field label { font-size: 12px; color: var(--text-secondary); }
    .form-field input, .form-inline input {
      width: 100%;
      min-width: 0;
      height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      background: #F7F8FA;
      font-size: 13.5px;
      color: var(--text-main);
      outline: none;
    }
    .form-inline input {
      flex: 1;
    }
    .form-field input:focus, .form-inline input:focus {
      background: #FFFFFF;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.1);
    }
    .modal-msg { min-height: 16px; font-size: 12px; color: var(--primary); }
    .modal-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }

    .btn-subtle {
      border: 1px solid var(--border-light);
      background: #F7F8FA;
      color: var(--text-main);
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-subtle:hover { background: var(--selected-bg); color: var(--primary); border-color: transparent; }

    .room-manage-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .room-manage-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 10px;
      background: #F7F8FA;
      font-size: 13px;
    }
    .room-manage-meta { display: flex; flex-direction: column; gap: 2px; }
    .room-manage-sub { font-size: 11.5px; color: var(--text-secondary); }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .desktop-stage { padding: 0; }
      .im-window { max-height: none; border-radius: 0; grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="desktop-stage">
    <div class="im-window">
      <!-- 左侧纯白会话面板 -->
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              <line x1="20" y1="20" x2="16.65" y2="16.65"></line>
            </svg>
            <input id="searchInput" class="search-input" type="text" placeholder="搜索房间或联系人" />
          </div>
          <button id="roomModalBtn" class="new-btn" type="button" title="创建或加入房间">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>

        <div id="sessionList" class="session-list"></div>

        <div class="sidebar-footer">
          <div class="me-info">
            <div id="meAvatar" class="avatar sm" style="background:linear-gradient(135deg,#4F8BFF,#7B68EE);">A</div>
            <div class="me-meta">
              <span id="meName" class="me-name">未登录</span>
              <span class="me-net">
                <span id="netLed" class="net-led"></span>
                <span id="netText">127.0.0.1:8888</span>
              </span>
            </div>
          </div>
          <button id="openConnBtn" class="link-btn" type="button">连接设置</button>
        </div>
      </aside>

      <!-- 右侧聊天主窗口 -->
      <section id="chatPanel" class="chat-panel">
        <div id="dropOverlay" class="drop-overlay">
          <span>松开鼠标，立即通过 TCP 分块传输发送文件或图片</span>
        </div>

        <header class="chat-header">
          <div class="chat-title-group">
            <h1 id="chatTitle" class="chat-title">局域网公共大厅</h1>
            <span id="chatSubtitle" class="chat-subtitle">在线 0 人</span>
          </div>

          <div class="header-actions">
            <button id="syncHistoryBtn" class="header-pill-btn" type="button" title="从 SQLite 服务端同步历史记录">同步历史</button>
            <button id="leaveRoomBtn" class="header-pill-btn danger" type="button" style="display:none;">退出房间</button>
          </div>
        </header>

        <div id="reconnectBanner" class="reconnect-banner"></div>

        <div id="chatBody" class="chat-body"></div>

        <!-- 底部纯白输入工具栏（无假图标，仅保留真实可用功能） -->
        <div class="composer-area">
          <input id="fileInput" type="file" hidden />
          <input id="imageInput" type="file" accept="image/*" hidden />

          <div id="emojiPopover" class="emoji-popover">
            <button class="emoji-btn" type="button">😊</button>
            <button class="emoji-btn" type="button">😂</button>
            <button class="emoji-btn" type="button">👍</button>
            <button class="emoji-btn" type="button">🎉</button>
            <button class="emoji-btn" type="button">👌</button>
            <button class="emoji-btn" type="button">🚀</button>
            <button class="emoji-btn" type="button">💡</button>
            <button class="emoji-btn" type="button">🔥</button>
            <button class="emoji-btn" type="button">🤝</button>
            <button class="emoji-btn" type="button">✨</button>
            <button class="emoji-btn" type="button">💻</button>
            <button class="emoji-btn" type="button">📡</button>
          </div>

          <div class="toolbar">
            <button id="emojiToggleBtn" class="icon-btn" type="button" title="表情">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9.5"></circle>
                <path d="M8.5 14.5c.9 1.3 2.1 2 3.5 2s2.6-.7 3.5-2"></path>
                <circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"></circle>
                <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"></circle>
              </svg>
            </button>
            <button id="fileBtn" class="icon-btn" type="button" title="发送文件（TCP 48KB 分块 + SHA-256 校验）">
              <svg viewBox="0 0 24 24">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
            </button>
            <button id="imageBtn" class="icon-btn" type="button" title="发送图片（TCP 分块传输 + 气泡预览）">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="16" rx="2.5" ry="2.5"></rect>
                <circle cx="8.5" cy="9.5" r="1.5"></circle>
                <polyline points="21 16 16 11 5 20"></polyline>
              </svg>
            </button>
          </div>

          <textarea
            id="msgInput"
            class="composer-textarea"
            placeholder="输入消息，Enter 发送，支持拖拽文件或 Ctrl+V 粘贴图片..."
          ></textarea>

          <div class="composer-footer">
            <span class="composer-hint">SQLite 持久化 · ACK 送达与已读回执 · 断线自动重连</span>
            <button id="sendBtn" class="send-btn" type="button">发送</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- 图片大图预览 -->
  <div id="lightbox" class="lightbox">
    <img id="lightboxImg" alt="图片预览" />
  </div>

  <div id="toast" class="toast"></div>

  <!-- 创建 / 加入房间弹窗 -->
  <div id="roomModal" class="modal-mask">
    <div class="modal-box">
      <div>
        <div class="modal-title">房间与群组管理</div>
        <div class="modal-sub">创建新的局域网群聊房间，或加入已有房间（服务端自动持久化房间与历史记录）。</div>
      </div>

      <div class="form-inline">
        <input id="newRoomNameInput" placeholder="输入新房间名称（如：计网实验组）" maxlength="24" />
        <button id="createRoomBtn" class="send-btn" type="button" style="padding:7px 16px;">创建</button>
      </div>

      <div id="roomManageList" class="room-manage-list"></div>

      <div class="modal-footer" style="justify-content:flex-end;">
        <button id="closeRoomModalBtn" class="btn-subtle" type="button">关闭</button>
      </div>
    </div>
  </div>

  <!-- 连接局域网服务端弹窗 -->
  <div id="connModal" class="modal-mask">
    <div class="modal-box">
      <div>
        <div class="modal-title">连接局域网聊天室</div>
        <div class="modal-sub">支持 UDP 局域网广播自动发现服务端，或手动填写服务端 IP 与 TCP 端口。</div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="hostInput">服务端 IP</label>
          <input id="hostInput" value="127.0.0.1" />
        </div>
        <div class="form-field">
          <label for="portInput">TCP 端口</label>
          <input id="portInput" value="8888" />
        </div>
      </div>

      <div class="form-field">
        <label for="nameInput">我的昵称</label>
        <input id="nameInput" value="Alice" placeholder="输入 1~20 个非空白字符" />
      </div>

      <div id="modalMsg" class="modal-msg"></div>

      <div class="modal-footer">
        <button id="discoverBtn" class="btn-subtle" type="button">UDP 自动发现</button>
        <div style="display:flex; gap:8px;">
          <button id="closeModalBtn" class="btn-subtle" type="button">取消</button>
          <button id="connectBtn" class="send-btn" type="button" style="padding:7px 18px;">连接</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_ROOM_ID = "lobby";
    const MAX_FILE_BYTES = 20 * 1024 * 1024;
    const AVATAR_GRADIENTS = [
      "linear-gradient(135deg, #4B8BFF, #6C63FF)",
      "linear-gradient(135deg, #38BDF8, #3B82F6)",
      "linear-gradient(135deg, #818CF8, #A855F7)",
      "linear-gradient(135deg, #34D399, #0EA5E9)",
      "linear-gradient(135deg, #F472B6, #8B5CF6)",
      "linear-gradient(135deg, #60A5FA, #2DD4BF)",
    ];

    function roomSessionKey(roomId) { return `room:${roomId}`; }
    function peerSessionKey(peer) { return `pm:${peer}`; }

    function avatarStyle(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
      return AVATAR_GRADIENTS[hash % AVATAR_GRADIENTS.length];
    }

    function avatarInitial(name, isRoom = false) {
      if (isRoom) return name === "局域网公共大厅" ? "群" : (name || "#").slice(0, 1);
      return (name || "?").trim().slice(0, 2).toUpperCase();
    }

    function nowHMS() { return new Date().toTimeString().slice(0, 8); }

    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function fileExt(filename) {
      const idx = (filename || "").lastIndexOf(".");
      if (idx === -1 || idx === filename.length - 1) return "FILE";
      return filename.slice(idx + 1, idx + 5).toUpperCase();
    }

    function genMsgId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "");
      return `m_${Date.now()}_${Math.random().toString(16).slice(2, 10)}`;
    }

    const state = {
      liveMode: window.location.protocol.startsWith("http"),
      connected: false,
      username: "Alice",
      host: "192.168.1.100",
      port: 8888,
      users: [],
      rooms: [],
      activeKey: roomSessionKey(DEFAULT_ROOM_ID),
      search: "",
      sessions: {},      // key -> { key, type:'room'|'pm', id, name, messages:[], msgMap:{}, unread:0, historyLoaded:false, lastText, lastTime }
      msgLookup: {},     // msg_id -> { sessionKey, msg }
      sentReadIds: new Set(),
      fileIndex: {},
      eventSource: null,
    };

    const els = {
      sessionList: document.getElementById("sessionList"),
      searchInput: document.getElementById("searchInput"),
      chatPanel: document.getElementById("chatPanel"),
      dropOverlay: document.getElementById("dropOverlay"),
      chatTitle: document.getElementById("chatTitle"),
      chatSubtitle: document.getElementById("chatSubtitle"),
      syncHistoryBtn: document.getElementById("syncHistoryBtn"),
      leaveRoomBtn: document.getElementById("leaveRoomBtn"),
      reconnectBanner: document.getElementById("reconnectBanner"),
      chatBody: document.getElementById("chatBody"),
      msgInput: document.getElementById("msgInput"),
      sendBtn: document.getElementById("sendBtn"),
      fileBtn: document.getElementById("fileBtn"),
      imageBtn: document.getElementById("imageBtn"),
      fileInput: document.getElementById("fileInput"),
      imageInput: document.getElementById("imageInput"),
      lightbox: document.getElementById("lightbox"),
      lightboxImg: document.getElementById("lightboxImg"),
      meAvatar: document.getElementById("meAvatar"),
      meName: document.getElementById("meName"),
      netLed: document.getElementById("netLed"),
      netText: document.getElementById("netText"),
      emojiToggleBtn: document.getElementById("emojiToggleBtn"),
      emojiPopover: document.getElementById("emojiPopover"),
      toast: document.getElementById("toast"),
      roomModal: document.getElementById("roomModal"),
      roomModalBtn: document.getElementById("roomModalBtn"),
      closeRoomModalBtn: document.getElementById("closeRoomModalBtn"),
      newRoomNameInput: document.getElementById("newRoomNameInput"),
      createRoomBtn: document.getElementById("createRoomBtn"),
      roomManageList: document.getElementById("roomManageList"),
      connModal: document.getElementById("connModal"),
      hostInput: document.getElementById("hostInput"),
      portInput: document.getElementById("portInput"),
      nameInput: document.getElementById("nameInput"),
      modalMsg: document.getElementById("modalMsg"),
      discoverBtn: document.getElementById("discoverBtn"),
      connectBtn: document.getElementById("connectBtn"),
      closeModalBtn: document.getElementById("closeModalBtn"),
      openConnBtn: document.getElementById("openConnBtn"),
    };

    let toastTimer = null;
    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 2200);
    }

    function ensureRoomSession(roomId, name) {
      const key = roomSessionKey(roomId);
      if (!state.sessions[key]) {
        state.sessions[key] = {
          key,
          type: "room",
          id: roomId,
          name: name || (roomId === DEFAULT_ROOM_ID ? "局域网公共大厅" : roomId),
          messages: [],
          msgMap: {},
          unread: 0,
          historyLoaded: false,
          lastText: "点击进入房间聊天",
          lastTime: "",
        };
      } else if (name) {
        state.sessions[key].name = name;
      }
      return state.sessions[key];
    }

    function ensurePeerSession(peer) {
      const key = peerSessionKey(peer);
      if (!state.sessions[key]) {
        state.sessions[key] = {
          key,
          type: "pm",
          id: peer,
          name: peer,
          messages: [],
          msgMap: {},
          unread: 0,
          historyLoaded: false,
          lastText: "在线 · 点击发送私聊消息",
          lastTime: "",
        };
      }
      return state.sessions[key];
    }

    function syncRooms(rooms) {
      state.rooms = rooms && rooms.length
        ? rooms
        : [{ room_id: DEFAULT_ROOM_ID, name: "局域网公共大厅", member_count: state.users.length, joined: true }];

      state.rooms.forEach((r) => {
        if (r.joined) ensureRoomSession(r.room_id, r.name);
      });

      const active = state.sessions[state.activeKey];
      if (active && active.type === "room") {
        const meta = state.rooms.find((r) => r.room_id === active.id);
        if (meta && !meta.joined) {
          state.activeKey = roomSessionKey(DEFAULT_ROOM_ID);
        }
      }

      renderSidebar();
      renderHeader();
      renderRoomManageModal();
    }

    function syncUsers(users) {
      state.users = users || [];
      state.users.forEach((u) => {
        if (u !== state.username) ensurePeerSession(u);
      });
      renderSidebar();
      renderHeader();
    }

    function upsertMessage(sessionKey, msg) {
      const session = state.sessions[sessionKey];
      if (!session) return;

      if (msg.msgId && session.msgMap[msg.msgId]) {
        const existing = session.msgMap[msg.msgId];
        if (msg.status === "delivered" && existing.status === "sending") {
          existing.status = "delivered";
        }
        if (msg.ts) existing.ts = msg.ts;
        if (Array.isArray(msg.readBy)) {
          msg.readBy.forEach((u) => {
            if (!existing.readBy.includes(u)) existing.readBy.push(u);
          });
        }
        if (state.activeKey === sessionKey) renderMessages();
        return;
      }

      if (!Array.isArray(msg.readBy)) msg.readBy = [];
      session.messages.push(msg);
      if (msg.msgId) {
        session.msgMap[msg.msgId] = msg;
        state.msgLookup[msg.msgId] = { sessionKey, msg };
      }

      if (msg.kind === "system") {
        session.lastText = `[系统] ${msg.text}`;
      } else if (msg.kind === "file") {
        const tag = msg.isImage ? "[图片]" : "[文件]";
        session.lastText = session.type === "room"
          ? `${msg.sender}: ${tag} ${msg.filename}`
          : `${tag} ${msg.filename}`;
      } else {
        session.lastText = session.type === "room" ? `${msg.sender}: ${msg.text}` : msg.text;
      }
      session.lastTime = (msg.ts || nowHMS()).slice(0, 5);

      if (state.activeKey !== sessionKey && msg.kind !== "system" && msg.sender !== state.username) {
        session.unread += 1;
      }

      renderSidebar();
      if (state.activeKey === sessionKey) {
        renderMessages();
        sendReadReceiptsForActive();
      }
    }

    async function fetchHistoryForSession(session, force = false) {
      if (!state.liveMode || !state.connected || !session) return;
      if (session.historyLoaded && !force) return;
      session.historyLoaded = true;
      const body = session.type === "room"
        ? { room_id: session.id, limit: 50 }
        : { peer: session.id, limit: 50 };
      await fetch("/api/history", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    }

    async function sendReadReceiptsForActive() {
      if (!state.liveMode || !state.connected) return;
      const session = state.sessions[state.activeKey];
      if (!session) return;
      const toMark = [];
      session.messages.forEach((m) => {
        if (
          m.msgId &&
          m.kind !== "system" &&
          m.sender !== state.username &&
          !state.sentReadIds.has(m.msgId)
        ) {
          state.sentReadIds.add(m.msgId);
          toMark.push(m.msgId);
        }
      });
      if (!toMark.length) return;
      await fetch("/api/read", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ msg_ids: toMark }),
      });
    }

    function renderMe() {
      els.meName.textContent = state.connected ? state.username : "未登录";
      els.meAvatar.textContent = avatarInitial(state.username, false);
      els.meAvatar.style.background = avatarStyle(state.username);
      els.netLed.classList.toggle("offline", !state.connected);
      els.netText.textContent = state.connected ? `${state.host}:${state.port}` : "未连接服务端";
    }

    function renderHeader() {
      const active = state.sessions[state.activeKey] || ensureRoomSession(DEFAULT_ROOM_ID, "局域网公共大厅");
      els.chatTitle.textContent = active.name;
      if (active.type === "room") {
        const roomMeta = state.rooms.find((r) => r.room_id === active.id);
        const count = roomMeta ? roomMeta.member_count : state.users.length;
        els.chatSubtitle.textContent = `群聊房间 · 在线 ${count} 人`;
        els.leaveRoomBtn.style.display = active.id === DEFAULT_ROOM_ID ? "none" : "inline-flex";
      } else {
        const online = state.users.includes(active.id);
        els.chatSubtitle.textContent = online ? "在线 · 点对点私聊" : "离线";
        els.leaveRoomBtn.style.display = "none";
      }
    }

    function renderSidebar() {
      const q = state.search.trim().toLowerCase();
      els.sessionList.innerHTML = "";

      const joinedRooms = state.rooms.filter((r) => r.joined);
      const roomKeys = joinedRooms.map((r) => roomSessionKey(r.room_id));
      const peerKeys = Object.keys(state.sessions).filter((k) => k.startsWith("pm:"));

      function appendGroup(title, keys) {
        const visible = keys
          .map((k) => state.sessions[k])
          .filter((s) => s && (!q || s.name.toLowerCase().includes(q) || s.lastText.toLowerCase().includes(q)));
        if (!visible.length) return;

        const label = document.createElement("div");
        label.className = "session-group-label";
        label.textContent = title;
        els.sessionList.appendChild(label);

        visible.forEach((s) => {
          const item = document.createElement("div");
          item.className = "session-item" + (state.activeKey === s.key ? " active" : "");
          const isRoom = s.type === "room";
          const isOnline = isRoom ? state.connected : state.users.includes(s.id);
          const bg = isRoom
            ? (s.id === DEFAULT_ROOM_ID
              ? "linear-gradient(135deg,#1677FF,#69B1FF)"
              : avatarStyle(s.name))
            : avatarStyle(s.name);

          item.innerHTML = `
            <div class="avatar-wrap">
              <div class="avatar" style="background:${bg};">${avatarInitial(s.name, isRoom)}</div>
              ${isOnline ? '<span class="status-dot"></span>' : ""}
            </div>
            <div class="session-main">
              <div class="session-row-top">
                <span class="session-name"></span>
                <span class="session-time"></span>
              </div>
              <div class="session-row-bottom">
                <span class="session-preview"></span>
                ${s.unread > 0 ? `<span class="unread-badge">${s.unread > 99 ? "99+" : s.unread}</span>` : ""}
              </div>
            </div>
          `;
          item.querySelector(".session-name").textContent = s.name;
          item.querySelector(".session-time").textContent = s.lastTime;
          item.querySelector(".session-preview").textContent = s.lastText;

          item.addEventListener("click", () => {
            state.activeKey = s.key;
            s.unread = 0;
            renderSidebar();
            renderHeader();
            renderMessages();
            fetchHistoryForSession(s);
            sendReadReceiptsForActive();
            els.msgInput.focus();
          });

          els.sessionList.appendChild(item);
        });
      }

      appendGroup("群聊房间", roomKeys);
      appendGroup("在线联系人", peerKeys);
    }

    function buildFileElement(m) {
      if (m.status === "done" && m.isImage && m.url) {
        const card = document.createElement("div");
        card.className = "image-card";
        card.dataset.fileId = m.fileId;

        const img = document.createElement("img");
        img.className = "chat-image-thumb";
        img.src = m.url;
        img.alt = m.filename;
        img.addEventListener("click", () => {
          els.lightboxImg.src = m.url;
          els.lightbox.classList.add("open");
        });

        const bar = document.createElement("div");
        bar.className = "image-card-bar";
        const statusSpan = document.createElement("span");
        statusSpan.className = m.verified ? "verified-tag" : "failed-tag";
        statusSpan.textContent = m.verified
          ? `SHA-256 已校验 · ${formatSize(m.size)}`
          : "校验异常";

        const dl = document.createElement("a");
        dl.className = "file-download-link";
        dl.href = m.url.startsWith("blob:") ? m.url : `${m.url}?download=1`;
        dl.download = m.filename;
        dl.textContent = "保存";

        bar.appendChild(statusSpan);
        bar.appendChild(dl);
        card.appendChild(img);
        card.appendChild(bar);
        return card;
      }

      const card = document.createElement("div");
      card.className = "file-card";
      card.dataset.fileId = m.fileId;

      const top = document.createElement("div");
      top.className = "file-card-top";
      top.innerHTML = `
        <div class="file-ext-badge">${fileExt(m.filename)}</div>
        <div class="file-meta">
          <div class="file-name"></div>
          <div class="file-size">${formatSize(m.size)} · ${m.totalChunks} 个 TCP 分块</div>
        </div>
      `;
      top.querySelector(".file-name").textContent = m.filename;
      card.appendChild(top);

      if (m.status !== "done") {
        const track = document.createElement("div");
        track.className = "progress-track";
        const fill = document.createElement("div");
        fill.className = "progress-fill";
        fill.style.width = `${m.percent || 0}%`;
        track.appendChild(fill);
        card.appendChild(track);

        const footer = document.createElement("div");
        footer.className = "file-card-footer";
        footer.innerHTML = `
          <span class="progress-text">TCP 分块传输 ${m.receivedChunks || 0}/${m.totalChunks}</span>
          <span class="progress-pct">${m.percent || 0}%</span>
        `;
        card.appendChild(footer);
      } else {
        const footer = document.createElement("div");
        footer.className = "file-card-footer";
        const badge = document.createElement("span");
        badge.className = m.verified ? "verified-tag" : "failed-tag";
        badge.textContent = m.verified ? "✓ SHA-256 校验通过" : "✕ 校验未通过";
        footer.appendChild(badge);

        if (m.url) {
          const dl = document.createElement("a");
          dl.className = "file-download-link";
          dl.href = m.url.startsWith("blob:") ? m.url : `${m.url}?download=1`;
          dl.download = m.filename;
          dl.textContent = "下载文件";
          footer.appendChild(dl);
        }
        card.appendChild(footer);
      }
      return card;
    }

    function updateFileProgressDOM(fileId, receivedChunks, totalChunks, percent) {
      const card = els.chatBody.querySelector(`.file-card[data-file-id="${fileId}"]`);
      if (!card) return;
      const fill = card.querySelector(".progress-fill");
      const text = card.querySelector(".progress-text");
      const pct = card.querySelector(".progress-pct");
      if (fill) fill.style.width = `${percent}%`;
      if (text) text.textContent = `TCP 分块传输 ${receivedChunks}/${totalChunks}`;
      if (pct) pct.textContent = `${percent}%`;
    }

    function formatReadStatus(m, sessionType) {
      const readers = (m.readBy || []).filter((u) => u !== state.username);
      if (readers.length > 0) {
        return {
          text: sessionType === "pm" ? "✓✓ 已读" : `✓✓ ${readers.length}人已读`,
          isRead: true,
        };
      }
      if (m.status === "sending") return { text: "发送中...", isRead: false };
      return { text: "✓ 已送达", isRead: false };
    }

    function renderMessages() {
      const active = state.sessions[state.activeKey] || ensureRoomSession(DEFAULT_ROOM_ID, "局域网公共大厅");
      els.chatBody.innerHTML = "";

      let lastMinute = "";
      active.messages.forEach((m) => {
        const minute = (m.ts || "").slice(0, 5);
        if (minute && minute !== lastMinute) {
          const divider = document.createElement("div");
          divider.className = "time-divider";
          divider.textContent = minute;
          els.chatBody.appendChild(divider);
          lastMinute = minute;
        }

        if (m.kind === "system") {
          const notice = document.createElement("div");
          notice.className = "sys-notice";
          notice.textContent = m.text;
          els.chatBody.appendChild(notice);
          return;
        }

        const isSelf = m.sender === state.username;
        const row = document.createElement("div");
        row.className = `msg-row ${isSelf ? "self" : "peer"}`;

        const avatar = document.createElement("div");
        avatar.className = "avatar sm";
        avatar.style.background = avatarStyle(m.sender);
        avatar.textContent = avatarInitial(m.sender, false);

        const col = document.createElement("div");
        col.className = "msg-content-col";

        if (active.type === "room" && !isSelf) {
          const senderEl = document.createElement("div");
          senderEl.className = "msg-sender-name";
          senderEl.textContent = m.sender;
          col.appendChild(senderEl);
        }

        if (m.kind === "file") {
          col.appendChild(buildFileElement(m));
        } else {
          const bubble = document.createElement("div");
          bubble.className = "msg-bubble";
          bubble.textContent = m.text;
          col.appendChild(bubble);

          if (isSelf) {
            const st = formatReadStatus(m, active.type);
            const statusEl = document.createElement("div");
            statusEl.className = "msg-status" + (st.isRead ? " read" : "");
            statusEl.textContent = st.text;
            col.appendChild(statusEl);
          }
        }

        row.appendChild(avatar);
        row.appendChild(col);
        els.chatBody.appendChild(row);
      });

      els.chatBody.scrollTop = els.chatBody.scrollHeight;
    }

    /* ========= 发送文本消息（带 msg_id 与 ACK 状态） ========= */
    async function sendCurrentMessage() {
      const text = els.msgInput.value.trim();
      if (!text) return;
      els.msgInput.value = "";
      els.emojiPopover.classList.remove("open");

      const active = state.sessions[state.activeKey];
      if (!active) return;

      const msgId = genMsgId();
      const ts = nowHMS();
      const isRoom = active.type === "room";

      if (!state.liveMode) {
        const msg = {
          msgId,
          kind: isRoom ? "chat" : "private",
          sender: state.username,
          to: isRoom ? null : active.id,
          text,
          ts,
          status: "sending",
          readBy: [],
        };
        upsertMessage(active.key, msg);
        setTimeout(() => {
          msg.status = "delivered";
          if (state.activeKey === active.key) renderMessages();
        }, 250);
        setTimeout(() => {
          msg.readBy = [isRoom ? "陈默" : active.id];
          if (state.activeKey === active.key) renderMessages();
        }, 900);
        return;
      }

      if (!state.connected) {
        openConnModal();
        return;
      }

      // 乐观渲染「发送中...」
      upsertMessage(active.key, {
        msgId,
        kind: isRoom ? "chat" : "private",
        sender: state.username,
        to: isRoom ? null : active.id,
        text,
        ts,
        status: "sending",
        readBy: [],
      });

      const res = await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          msg_id: msgId,
          text,
          to: isRoom ? null : active.id,
          room_id: isRoom ? active.id : DEFAULT_ROOM_ID,
        }),
      });
      const data = await res.json();
      if (!data.ok) {
        showToast(data.error || "发送失败");
      }
    }

    /* ========= 发送文件 / 图片（TCP 48KB 分块） ========= */
    async function uploadFileOrImage(file, forceImage = null) {
      if (!file) return;
      if (file.size > MAX_FILE_BYTES) {
        showToast("单个文件不能超过 20 MB");
        return;
      }
      const active = state.sessions[state.activeKey];
      if (!active) return;

      const isImage = forceImage !== null ? forceImage : file.type.startsWith("image/");
      const isRoom = active.type === "room";

      if (!state.liveMode) {
        const totalChunks = Math.max(1, Math.ceil(file.size / (48 * 1024)));
        const fileId = `demo_${Date.now()}`;
        const blobUrl = URL.createObjectURL(file);
        const msg = {
          kind: "file",
          fileId,
          filename: file.name,
          size: file.size,
          isImage,
          totalChunks,
          receivedChunks: totalChunks,
          percent: 100,
          status: "done",
          verified: true,
          url: blobUrl,
          sender: state.username,
          ts: nowHMS(),
        };
        upsertMessage(active.key, msg);
        return;
      }

      if (!state.connected) {
        openConnModal();
        return;
      }

      const headers = {
        "Content-Type": "application/octet-stream",
        "X-Filename": encodeURIComponent(file.name),
        "X-Mime-Type": file.type || "application/octet-stream",
        "X-Is-Image": isImage ? "true" : "false",
      };
      if (isRoom) {
        headers["X-Room-Id"] = encodeURIComponent(active.id);
      } else {
        headers["X-To"] = encodeURIComponent(active.id);
      }

      try {
        const res = await fetch("/api/upload", { method: "POST", headers, body: file });
        const data = await res.json();
        if (!data.ok) {
          showToast(data.error || "文件上传失败");
        } else {
          showToast(`开始 TCP 分块发送 ${file.name}（共 ${data.total_chunks} 块）`);
        }
      } catch (err) {
        showToast(`发送异常: ${err.message}`);
      }
    }

    async function joinRoom(roomId, roomName) {
      if (!state.liveMode) {
        const r = state.rooms.find((x) => x.room_id === roomId);
        if (r) r.joined = true;
        const s = ensureRoomSession(roomId, roomName);
        state.activeKey = s.key;
        syncRooms(state.rooms);
        els.roomModal.classList.remove("open");
        return;
      }
      await fetch("/api/rooms/join", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ room_id: roomId }),
      });
      const s = ensureRoomSession(roomId, roomName);
      state.activeKey = s.key;
      els.roomModal.classList.remove("open");
      renderSidebar();
      renderHeader();
      renderMessages();
      fetchHistoryForSession(s, true);
    }

    async function leaveRoom(roomId) {
      if (roomId === DEFAULT_ROOM_ID) return;
      if (!state.liveMode) {
        const r = state.rooms.find((x) => x.room_id === roomId);
        if (r) r.joined = false;
        state.activeKey = roomSessionKey(DEFAULT_ROOM_ID);
        syncRooms(state.rooms);
        renderMessages();
        return;

      await fetch("/api/rooms/leave", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ room_id: roomId }),

      state.activeKey = roomSessionKey(DEFAULT_ROOM_ID);
      renderSidebar();
      renderHeader();
      renderMessages();

    /* ========= SSE 协议事件处理 ========= */
    function resolveFileSessionKey(pkt) {
      if (pkt.to) {
        const peer = pkt.sender === state.username ? pkt.to : pkt.sender;
        ensurePeerSession(peer);
        return peerSessionKey(peer);
      }
      const rid = pkt.room_id || DEFAULT_ROOM_ID;
      ensureRoomSession(rid);
      return roomSessionKey(rid);
    }

    function handlePacket(pkt) {
      const ts = pkt.ts || nowHMS();

      if (pkt.type === "CHAT") {
        const rid = pkt.room_id || DEFAULT_ROOM_ID;
        ensureRoomSession(rid);
        upsertMessage(roomSessionKey(rid), {
          msgId: pkt.msg_id,
          kind: "chat",
          sender: pkt.sender,
          text: pkt.text,
          ts,
          status: "delivered",
          readBy: [],
        });
      } else if (pkt.type === "PRIVATE") {
        const peer = pkt.sender === state.username ? pkt.to : pkt.sender;
        ensurePeerSession(peer);
        upsertMessage(peerSessionKey(peer), {
          msgId: pkt.msg_id,
          kind: "private",
          sender: pkt.sender,
          to: pkt.to,
          text: pkt.text,
          ts,
          status: "delivered",
          readBy: [],
        });
      } else if (pkt.type === "MSG_ACK") {
        const entry = state.msgLookup[pkt.msg_id];
        if (entry) {
          entry.msg.status = pkt.status || "delivered";
          if (state.activeKey === entry.sessionKey) renderMessages();
        }
      } else if (pkt.type === "MSG_READ") {
        const entry = state.msgLookup[pkt.msg_id];
        if (entry && pkt.reader && !entry.msg.readBy.includes(pkt.reader)) {
          entry.msg.readBy.push(pkt.reader);
          if (state.activeKey === entry.sessionKey) renderMessages();
        }
      } else if (pkt.type === "HISTORY_RESP") {
        const key = pkt.peer
          ? ensurePeerSession(pkt.peer).key
          : ensureRoomSession(pkt.room_id || DEFAULT_ROOM_ID).key;
        const list = pkt.messages || [];
        list.forEach((m) => {
          upsertMessage(key, {
            msgId: m.msg_id,
            kind: m.conv_type === "private" ? "private" : "chat",
            sender: m.sender,
            to: m.to,
            text: m.text,
            ts: m.ts,
            status: m.status || "delivered",
            readBy: m.read_by || [],
          });
        });
        if (state.activeKey === key) {
          renderMessages();
          sendReadReceiptsForActive();
        }
      } else if (pkt.type === "ROOM_LIST") {
        syncRooms(pkt.rooms || []);
      } else if (pkt.type === "USER_LIST") {
        syncUsers(pkt.users || []);
      } else if (pkt.type === "SYSTEM") {
        const rid = pkt.room_id || DEFAULT_ROOM_ID;
        ensureRoomSession(rid);
        upsertMessage(roomSessionKey(rid), { kind: "system", text: pkt.text, ts });
      } else if (pkt.type === "ERROR") {
        showToast(pkt.text || "服务端返回错误");
      } else if (pkt.type === "FILE_START") {
        const key = resolveFileSessionKey(pkt);
        const msg = {
          kind: "file",
          fileId: pkt.file_id,
          filename: pkt.filename,
          size: pkt.size,
          isImage: Boolean(pkt.is_image),
          totalChunks: pkt.total_chunks || 1,
          receivedChunks: 0,
          percent: 0,
          status: "transferring",
          verified: false,
          url: null,
          sender: pkt.sender,
          to: pkt.to,
          ts,
        };
        state.fileIndex[pkt.file_id] = { sessionKey: key, msg };
        upsertMessage(key, msg);
      } else if (pkt.type === "FILE_PROGRESS") {
        const entry = state.fileIndex[pkt.file_id];
        if (!entry) return;
        entry.msg.receivedChunks = pkt.received_chunks;
        entry.msg.percent = pkt.percent;
        if (state.activeKey === entry.sessionKey) {
          updateFileProgressDOM(pkt.file_id, pkt.received_chunks, pkt.total_chunks, pkt.percent);
        }
      } else if (pkt.type === "FILE_COMPLETE") {
        const entry = state.fileIndex[pkt.file_id];
        if (entry) {
          entry.msg.status = "done";
          entry.msg.percent = 100;
          entry.msg.receivedChunks = entry.msg.totalChunks;
          entry.msg.verified = Boolean(pkt.verified);
          entry.msg.url = pkt.url;
          if (state.activeKey === entry.sessionKey) renderMessages();
        } else {
          const key = resolveFileSessionKey(pkt);
          const msg = {
            kind: "file",
            fileId: pkt.file_id,
            filename: pkt.filename,
            size: pkt.size,
            isImage: Boolean(pkt.is_image),
            totalChunks: pkt.total_chunks || 1,
            receivedChunks: pkt.total_chunks || 1,
            percent: 100,
            status: "done",
            verified: Boolean(pkt.verified),
            url: pkt.url,
            sender: pkt.sender,
            to: pkt.to,
            ts,
          };
          state.fileIndex[pkt.file_id] = { sessionKey: key, msg };
          upsertMessage(key, msg);
        }
      } else if (pkt.type === "DISCONNECTED") {
        state.connected = false;
        renderMe();
        if (pkt.reconnecting) {
          els.reconnectBanner.textContent = pkt.text || "连接断开，准备自动重连...";
          els.reconnectBanner.classList.add("visible");
        }
      } else if (pkt.type === "RECONNECTING") {
        state.connected = false;
        renderMe();
        els.reconnectBanner.textContent = pkt.text || "正在尝试自动重连...";
        els.reconnectBanner.classList.add("visible");
      } else if (pkt.type === "RECONNECTED") {
        state.connected = true;
        state.username = pkt.username || state.username;
        els.reconnectBanner.classList.remove("visible");
        renderMe();
        syncRooms(pkt.rooms || state.rooms);
        syncUsers(pkt.users || state.users);
        showToast("已自动重新连接并同步历史消息");
        const active = state.sessions[state.activeKey];
        if (active) fetchHistoryForSession(active, true);
      }
    }

    function startSSE() {
      if (state.eventSource) state.eventSource.close();
      const es = new EventSource("/api/events");
      state.eventSource = es;
      es.onmessage = (ev) => {
        try { handlePacket(JSON.parse(ev.data)); } catch (_) {}
      };
    }

      try {
        const res = await fetch("/api/connect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ host, port, username }),
        });
        const data = await res.json();
        if (!data.ok) {
          els.modalMsg.textContent = data.error || "连接失败";
          return;
        }
        state.host = host;
        state.port = port;
        state.username = data.username;
        state.connected = true;
        els.reconnectBanner.classList.remove("visible");
        renderMe();
        syncRooms(data.rooms || []);
        syncUsers(data.users || []);
        startSSE();
        els.connModal.classList.remove("open");
        fetchHistoryForSession(state.sessions[state.activeKey], true);
        showToast("已成功接入局域网聊天室");
      } catch (err) {
        els.modalMsg.textContent = `连接异常: ${err.message}`;
      }
    });

    /* ========= 启动初始化 ========= */
    (async function init() {
      ensureRoomSession(DEFAULT_ROOM_ID, "局域网公共大厅");

      if (state.liveMode) {
        try {
          const res = await fetch("/api/status");
          if (!res.ok) throw new Error("no live bridge");
          const data = await res.json();
          if (data.connected) {
            state.connected = true;
            state.host = data.host;
            state.port = data.port;
            state.username = data.username;
            renderMe();
            syncRooms(data.rooms || []);
            syncUsers(data.users || []);
            renderMessages();
            startSSE();
            fetchHistoryForSession(state.sessions[state.activeKey], true);
          } else {
            state.connected = false;
            renderMe();
            syncRooms([]);
            renderMessages();
            openConnModal();
          }
          return;
        } catch (_) {
          state.liveMode = false;
        }
      }

      // 离线预览模式
      state.connected = true;
      state.username = "林澈";
      state.host = "192.168.1.100";
      state.port = 8888;
      renderMe();
      syncRooms([
        { room_id: DEFAULT_ROOM_ID, name: "局域网公共大厅", creator: "system", member_count: 4, joined: true },
        { room_id: "room_cn_lab", name: "计网实验讨论组", creator: "陈默", member_count: 2, joined: true },
      ]);
      syncUsers(["林澈", "陈默", "苏晚", "实验机-04"]);

      const lobbyKey = roomSessionKey(DEFAULT_ROOM_ID);
      upsertMessage(lobbyKey, { kind: "system", text: "已连接服务端并同步 SQLite 历史记录", ts: "20:12:03" });
      upsertMessage(lobbyKey, { msgId: "d1", kind: "chat", sender: "陈默", text: "我已经建了「计网实验讨论组」房间，点左上角 + 可以管理房间。", ts: "20:12:18", status: "delivered", readBy: ["林澈"] });
      upsertMessage(lobbyKey, { msgId: "d2", kind: "chat", sender: "林澈", text: "收到！消息气泡下方现在会实时显示送达和已读回执。", ts: "20:12:41", status: "delivered", readBy: ["陈默", "苏晚"] });
      state.sessions[lobbyKey].unread = 0;
      renderSidebar();
      renderHeader();
      renderMessages();
    })();
  </script>
</body>
